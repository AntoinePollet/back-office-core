# Vérifications du site à chaque demande de fusion (y compris celles ouvertes par Renovate pour une nouvelle
# version du core) : installation, base locale, types, construction. Rien n'est envoyé chez Cloudflare.
name: Vérifier

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Installation, types, construction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # La version de pnpm est celle du champ « packageManager » de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Échoue si pnpm-lock.yaml ne correspond pas à package.json : une mise à jour incomplète n'est jamais fusionnée.
      - name: Installation
        run: pnpm install --frozen-lockfile
      - name: Migrations sur une base locale vide
        run: pnpm exec wrangler d1 migrations apply DB --local
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
      - name: Types
        run: pnpm exec nuxt typecheck
      - name: Construction
        run: pnpm exec nuxt build
